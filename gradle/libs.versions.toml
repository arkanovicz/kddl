[versions]
kotlin = "2.3.21"
dokka = "2.2.0"
mavenPublish = "0.37.0"
versionsPlugin = "0.67.0"
pluginPublish = "2.2.1"

# 1.0.14 is built on Kotlin 2.4: a 2.3 library must stay on 1.0.13
antlrKotlin = "1.0.13"
clikt = "5.1.0"
coroutines = "1.11.0"
postgres = "42.7.14"
# mysql-connector-j 9.x pulls protobuf-java 4.x onto the buildscript classpath
# of consumers, breaking AGP's Tink-based release tasks (NoSuchMethodError on
# Keyset.makeExtensionsImmutable). 8.4.0 is the last release on protobuf 3.x.
mysql = "8.4.0"
testcontainers = "2.0.5"
h2 = "2.4.240"
hsqldb = "2.7.4"

[libraries]
antlr-kotlin-runtime = { module = "com.strumenta:antlr-kotlin-runtime", version.ref = "antlrKotlin" }
antlr-kotlin-target = { module = "com.strumenta:antlr-kotlin-target", version.ref = "antlrKotlin" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hsqldb = { module = "org.hsqldb:hsqldb", version.ref = "hsqldb" }

[plugins]
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versionsPlugin" }
antlrKotlin = { id = "com.strumenta.antlr-kotlin", version.ref = "antlrKotlin" }
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
